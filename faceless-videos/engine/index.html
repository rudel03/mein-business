<script type="module">

import { setupWorld } from './world.js';

// Abschluss-Look: Vignette + leichte Farbwärme + feines Korn (wirkt hochwertiger, weniger "Computer")
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, vig: { value: 0.32 }, warm: { value: 0.04 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time, vig, warm; varying vec2 vUv;
    float rnd(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + time) * 43758.5453); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv);
      c.rgb = mix(c.rgb, c.rgb * vec3(1.0 + warm, 1.0, 1.0 - warm), 1.0);
      float l = dot(c.rgb, vec3(0.299,0.587,0.114)); c.rgb = mix(vec3(l), c.rgb, 1.08);
      vec2 d = vUv - 0.5; c.rgb *= 1.0 - vig * dot(d, d) * 2.2;
      c.rgb += (rnd(vUv * 900.0) - 0.5) * 0.018;

// entfernt ungültige Pixel (NaN/Inf), bevor der Glow sie über das ganze Bild verschmiert
const CleanShader = {
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv);
      if (c.r != c.r || c.g != c.g || c.b != c.b || c.a != c.a) c = vec4(0.0, 0.0, 0.0, 1.0);

  if (!s) return;
  s.traverse(o => { o.geometry?.dispose?.(); const ms = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    ms.forEach(m => { for (const k of ['map', 'envMap', 'emissiveMap']) m[k]?.dispose?.(); m.dispose?.(); }); });

  mod.shots[s.name].update(lt, s.dur, cam, ctx);
