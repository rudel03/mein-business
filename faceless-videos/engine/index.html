<script type="module">
import * as THREE from 'three';
import { setupWorld } from './world.js';
let R, cam, cur = -1, scene, ctx, mod, plan;
function disposeScene(s) { s?.traverse(o => { o.geometry?.dispose?.(); }); }
window.init = async (p) => {
  plan = p;
  mod = await import(`./scenes/${p.scene}.js`);
  R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  R.setPixelRatio(1); R.setSize(p.W, p.H);

  return Object.keys(mod.shots);
};
window.frame = (t) => {
  let i = plan.shots.findIndex(s => t >= s.start && t < s.start + s.dur);

  const s = plan.shots[i];
  if (i !== cur) {
    disposeScene(scene);

};
