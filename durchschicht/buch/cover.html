<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BC;src:url(../brand/fonts/barlow-condensed-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:BC;src:url(../brand/fonts/barlow-condensed-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:MO;src:url(../brand/fonts/jetbrains-mono-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:MO;src:url(../brand/fonts/jetbrains-mono-latin-700-normal.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1240px;height:1653px;background:#0E1A2B;position:relative;overflow:hidden;color:#F3F0E8}
.photo{position:absolute;left:0;right:0;top:0;height:1000px;background:url(../brand/mood/m3.jpg) center 30%/cover}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,26,43,.0) 55%,#0E1A2B 100%)}
.top{position:absolute;top:56px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center}
.top img{height:96px}.logo{background:rgba(14,26,43,.92);padding:18px 26px 14px;border-radius:10px}
.badge{font:700 26px/1 MO;letter-spacing:.14em;background:#FF5B1F;color:#fff;padding:14px 20px;border-radius:6px}
.shifts{position:absolute;left:72px;right:72px;top:930px;display:flex;gap:10px}
.shifts div{flex:1;height:22px;border-radius:4px}
.title{position:absolute;left:72px;right:72px;top:990px}
.kick{font:700 30px/1 MO;letter-spacing:.18em;color:#FF5B1F;margin-bottom:22px;text-transform:uppercase}
h1{font:800 150px/.86 BC;text-transform:uppercase;letter-spacing:-.005em}
h1 span{color:#E9F24A}
.sub{font:600 52px/1.05 BC;text-transform:uppercase;margin-top:26px;color:#F3F0E8}
.meta{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;font:500 26px/1 MO;letter-spacing:.1em;color:#8A97A8;text-transform:uppercase;border-top:2px solid #24344d;padding-top:24px}
</style></head><body>
<div class="photo"></div>
<div class="top"><span class="logo"><img src="../brand/logo_transparent_hellschrift.svg"></span><span class="badge">E-BOOK · PDF</span></div>
<div class="shifts"><div style="background:#F2C230"></div><div style="background:#FF5B1F"></div><div style="background:#3B6FE0"></div></div>
<div class="title"><div class="kick">Das Essenssystem für</div><h1>Früh.<br>Spät.<br><span>Nacht.</span></h1><div class="sub">Essen nach Dienstplan</div></div>
<div class="meta"><span>48 Rezepte</span><span>6 Dienstplan-Pläne</span><span>Lagerkarte</span></div>
</body></html>
